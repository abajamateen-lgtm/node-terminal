<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node - Compose</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #71767b;
            --accent-blue: #1d9bf0;
            --border: #2f3336;
        }
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            overflow: hidden; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 20px; 
            border-bottom: 1px solid var(--border);
        }
        .cancel { 
            cursor: pointer; 
            color: white; 
            font-size: 15px; 
            font-weight: 500; 
        }
        
        .post-btn { 
            -webkit-appearance: none;
            appearance: none;
            background-color: var(--accent-blue) !important; 
            border: none; 
            color: #ffffff !important; 
            padding: 8px 22px; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer;
            opacity: 1 !important;
            transition: opacity 0.2s ease;
        }

        .post-btn:disabled { 
            background-color: var(--accent-blue) !important;
            opacity: 0.5 !important; 
            cursor: not-allowed;
        }

        .editor-container { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .avatar { 
            width: 40px; 
            height: 40px; 
            background: #333; 
            border-radius: 50%; 
            flex-shrink: 0; 
            overflow: hidden; 
        }
        
        textarea { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 19px; 
            outline: none; 
            resize: none; 
            height: 350px;
            font-family: inherit; 
            line-height: 1.4;
        }

        .tools-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 12px 20px; 
            border-top: 1px solid var(--border);
            display: flex; 
            justify-content: flex-start; 
            align-items: center;
            background: var(--bg-color);
        }
        
        .tool-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            cursor: pointer; 
        }
        .label { 
            font-size: 10px; 
            color: var(--text-dim); 
            text-transform: uppercase; 
            font-weight: 600; 
        }
        .icon { 
            stroke: var(--accent-blue); 
            stroke-width: 2; 
            fill: none; 
            width: 22px; 
            height: 22px; 
        }
    </style>
</head>
<body>

    <header>
        <span class="cancel" id="cancelBtn">Cancel</span>
        <button class="post-btn" id="postBtn" disabled>Post</button>
    </header>

    <div class="editor-container">
        <div class="avatar" id="userAvatarContainer"></div>
        <textarea id="postInput" placeholder="What's happening?"></textarea>
    </div>

    <div class="tools-bar">
        <div class="tool-item">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="label">Media</span>
        </div>
    </div>

    <script type="module" src="create.js"></script>
</body>
</html>
