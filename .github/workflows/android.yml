 name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Initialize Project Package
      run: |
        echo '{"name": "node-terminal", "version": "1.0.0", "dependencies": {}, "devDependencies": {}}' > package.json

    - name: Install Mobile Wrapper (Capacitor)
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init "Node Terminal" "com.nodeterminal.app" --web-dir=.
        npx cap add android

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
