<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node - Access</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-color: #000000; --text-color: #ffffff; --charcoal: #262626; --input-bg: #121212; --error-red: #ff4d4d; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-container { width: 85%; max-width: 300px; text-align: center; }
        .logo { width: 40px; margin-bottom: 30px; border-radius: 8px; }
        #errorMessage { color: var(--error-red); font-size: 12px; margin-bottom: 15px; display: none; text-align: left; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; }
        .ghost-input { width: 100%; background: var(--input-bg); border: 1px solid var(--charcoal); border-radius: 12px; padding: 16px; color: var(--text-color); margin-bottom: 12px; outline: none; transition: border 0.3s; }
        .ghost-input:focus { border-color: #555; }
        .btn-primary, .btn-secondary { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .btn-primary { background-color: var(--text-color); color: var(--bg-color); }
        .btn-primary:active { opacity: 0.8; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--charcoal); color: var(--text-color); }
        .auth-toggle { font-size: 12px; color: #888; margin-top: 20px; cursor: pointer; }
        .auth-toggle span { color: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <img src="nodelogo.jpg" alt="Node" class="logo">
        
        <div id="errorMessage"></div> 

        <form id="authForm">
            <input type="email" id="email" class="ghost-input" placeholder="Email" required>
            <input type="password" id="password" class="ghost-input" placeholder="Password" required>
            <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
        </form>

        <button type="button" id="googleBtn" class="btn-secondary" style="display: none;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G" style="width: 18px; margin-right: 10px;">
            Continue with Google
        </button>

        <div class="auth-toggle" id="toggleMode">
            Don't have an account? <span>Sign up</span>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
